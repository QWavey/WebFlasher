<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#b23f0d"/>
  <!-- Top-left half: duck head + beak -->
  <g>
    <circle cx="8" cy="9" r="5.5" fill="#fff5e6"/>
    <circle cx="10" cy="7.5" r="0.9" fill="#16110c"/>
    <path d="M12,9 L16.5,7.5 L16.5,10.5 L12,10 Z" fill="#f97316"/>
  </g>
  <!-- Bottom-right half: duck body + tail -->
  <g>
    <ellipse cx="22" cy="23" rx="8" ry="5" fill="#fff5e6"/>
    <path d="M14,21 L18,22 L14,24 Z" fill="#fff5e6"/>
  </g>
  <!-- Cut/separation line (subtle, showing "split") -->
  <line x1="0" y1="20" x2="20" y2="0" stroke="#7a2607" stroke-width="1" opacity="0.55"/>
</svg>
