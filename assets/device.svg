<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 0 382 570" role="img" aria-labelledby="figtitle">
          <title id="figtitle">NEW DUC v2.0 board, component side. USB-C at one end, USB-A at the other, with a microSD socket, the X1 crystal, the SW1 boot button and an eight-pad header between them. The microcontroller is on the reverse.</title>

  <style>
    .shell, .board, .part { fill:none; stroke:#F5F5F7; stroke-linecap:round; stroke-linejoin:round; }
    .shell, .board { stroke-width:1.5; }
    .part    { stroke-width:1.1; stroke:#A1A1A6; }
    .card    { stroke:#34343B; }
    .passive { fill:none; stroke:#34343B; stroke-width:1; }
    .ink     { fill:#8A8A8F; stroke:none; }
    .drill   { fill:#101013; }
    .ghost   { fill:none; stroke:#34343B; stroke-width:1; stroke-dasharray:5 4; }
    .callout { fill:none; stroke:#34343B; stroke-width:0.7; }
    .callout circle { fill:#FF6A13; stroke:none; }
    .callout text {
      font-family:"IBM Plex Mono", ui-monospace, monospace;
      font-size:18px; font-weight:500; letter-spacing:0.03em;
      fill:#8A8A8F; stroke:none;
    }
    .callout.end text { text-anchor:end; }
    .callout text.sub { font-size:16px; }
    .led { fill:#FF6A13; stroke:none; }
  </style>


          <!-- USB-C plug. Built the same way as the USB-A end below: shell,
               rolled tip edge, folded side seams. What tells them apart is
               what is true of the real parts: this one is much narrower and has
               latch dimples where USB-A has two stamped windows. -->
          <g class="shell">
            <rect x="117" y="28" width="66" height="52" rx="3.5"/>
            <path d="M117 38 H183"/>
            <path d="M126 38 V80 M174 38 V80"/>
            <rect x="132" y="52" width="14" height="6" rx="3"/>
            <rect x="154" y="52" width="14" height="6" rx="3"/>
          </g>
          <g class="part">
            <rect x="102" y="80" width="96" height="16" rx="2"/>
            <path d="M112 80 V96 M188 80 V96"/>
          </g>

          <!-- board -->
          <g class="board">
            <rect x="74" y="96" width="152" height="356" rx="4"/>
          </g>

          <!-- microSD socket: metal cage, card, and the eight spring contacts -->
          <g class="part">
            <rect x="80" y="112" width="140" height="140" rx="2"/>
            <path d="M88 144 L112 120"/>
            <path d="M96 128 H186 L204 146 V210 H96 Z" class="card"/>
            <path d="M104 136 H178" class="card"/>
          </g>
          <g class="passive">
            <rect x="100" y="222" width="11" height="9" rx="2"/>
            <rect x="114" y="222" width="11" height="9" rx="2"/>
            <rect x="128" y="222" width="11" height="9" rx="2"/>
            <rect x="142" y="222" width="11" height="9" rx="2"/>
            <rect x="156" y="222" width="11" height="9" rx="2"/>
            <rect x="170" y="222" width="11" height="9" rx="2"/>
            <rect x="184" y="222" width="11" height="9" rx="2"/>
            <rect x="198" y="222" width="11" height="9" rx="2"/>
            <rect x="70" y="132" width="10" height="18" rx="1"/>
            <rect x="220" y="132" width="10" height="18" rx="1"/>
            <rect x="70" y="214" width="10" height="18" rx="1"/>
            <rect x="220" y="214" width="10" height="18" rx="1"/>
          </g>

          <!-- X1 crystal, left edge -->
          <g class="part">
            <rect x="84" y="284" width="46" height="46" rx="3"/>
            <rect x="92" y="292" width="30" height="30" rx="2" class="card"/>
          </g>
          <g class="passive">
            <rect x="80" y="288" width="8" height="12" rx="1"/>
            <rect x="126" y="288" width="8" height="12" rx="1"/>
            <rect x="80" y="314" width="8" height="12" rx="1"/>
            <rect x="126" y="314" width="8" height="12" rx="1"/>
          </g>

          <!-- SW1 boot button, right edge -->
          <g class="part boot" id="figBoot">
            <rect x="146" y="288" width="50" height="50" rx="3"/>
            <circle cx="171" cy="313" r="14"/>
            <path d="M151 288 v-6 M191 288 v-6 M151 338 v6 M191 338 v6"/>
          </g>

          <!-- passives between the parts -->
          <g class="passive">
            <rect x="138" y="262" width="9" height="14" rx="1"/>
            <rect x="160" y="262" width="9" height="14" rx="1"/>
            <rect x="138" y="352" width="14" height="9" rx="1"/>
          </g>

          <!-- eight-pad header, right edge -->
          <g class="ink">
            <circle cx="209" cy="300" r="4"/><circle cx="209" cy="316" r="4"/>
            <circle cx="209" cy="332" r="4"/><circle cx="209" cy="348" r="4"/>
            <circle cx="209" cy="364" r="4"/><circle cx="209" cy="380" r="4"/>
            <circle cx="209" cy="396" r="4"/><circle cx="209" cy="412" r="4"/>
          </g>

          <!-- microcontroller, reverse side: hidden-line convention -->
          <rect class="ghost" x="104" y="376" width="62" height="62" rx="2"/>

          <!-- the two large vias by the USB-A end -->
          <g class="ink">
            <circle cx="92" cy="430" r="6.5"/>
            <circle cx="92" cy="430" r="2.6" class="drill"/>
            <circle cx="208" cy="430" r="6.5"/>
            <circle cx="208" cy="430" r="2.6" class="drill"/>
          </g>

          <!-- USB-A plug -->
          <g class="shell">
            <rect x="99" y="452" width="102" height="92" rx="2"/>
            <path d="M99 536 H201"/>
            <path d="M109 458 V536 M191 458 V536"/>
            <rect x="120" y="476" width="24" height="26" rx="3"/>
            <rect x="156" y="476" width="24" height="26" rx="3"/>
          </g>

          <!-- callouts -->
          <g class="callout">
            <path d="M187 57 H246"/><circle cx="187" cy="57" r="2.4"/>
            <text x="252" y="61">USB-C</text>

            <path d="M220 176 H246"/><circle cx="220" cy="176" r="2.4"/>
            <text x="252" y="173">microSD</text>
            <text x="252" y="187" class="sub">payload</text>

            <path d="M196 313 H246"/><circle cx="196" cy="313" r="2.4"/>
            <text x="252" y="310">SW1</text>
            <text x="252" y="324" class="sub">boot</text>

            <path d="M213 396 H246"/><circle cx="213" cy="396" r="2.4"/>
            <text x="252" y="400">header</text>

            <path d="M201 498 H246"/><circle cx="201" cy="498" r="2.4"/>
            <text x="252" y="502">USB-A</text>
          </g>
          <g class="callout end">
            <path d="M84 307 H62"/><circle cx="84" cy="307" r="2.4"/>
            <text x="56" y="304">X1</text>
            <text x="56" y="318" class="sub">12 MHz</text>

            <path d="M104 407 H62"/><circle cx="104" cy="407" r="2.4"/>
            <text x="56" y="404">MCU</text>
            <text x="56" y="418" class="sub">reverse</text>
          </g>
        </svg>
